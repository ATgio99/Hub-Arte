    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=boska@400,500,700,900&f[]=zodiak@400,500,700&f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      /* iOS safe-area: il body non ha padding, ci pensa .shell3d */
      body { margin: 0; }
      /* Layout: NON usiamo overflow:hidden su html perché su iOS causa bug
         di "testo che scompare" durante lo scroll. */
      html { overscroll-behavior: none; }
      body { overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
      /* Prevent text selection on UI elements for mobile */
      .chip, .btn, nav a, .dot { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* Better touch targets */
      .chip { min-height: 36px; display: inline-flex; align-items: center; }
      .btn { min-height: 40px; }
      /* Animazione pulse per badge notifiche */
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.92; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
